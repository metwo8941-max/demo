name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Check UNITY_LICENSE secret
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "UNITY_LICENSE is missing in repository secrets."
            echo "Please open GitHub settings in UniIDE and configure UNITY_LICENSE before running the build again."
            exit 1
          fi
          echo "UNITY_LICENSE is configured."

      - name: Create Unity license validation script
        run: |
          mkdir -p Assets/Editor/UniIDE/Generated
          cat > Assets/Editor/UniIDE/Generated/UnityLicenseValidation.cs <<'EOF'
          using UnityEngine;

          namespace UniIDE.Generated
          {
              public static class UnityLicenseValidation
              {
                  public static void ValidateLicense()
                  {
                      Debug.Log("UNITY_LICENSE validation succeeded.");
                  }
              }
          }
          EOF

      - name: Verify Unity license
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: 6000.2.5f1
          buildMethod: UniIDE.Generated.UnityLicenseValidation.ValidateLicense
          allowDirtyBuild: true

      - name: Restore Library Cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-
            Library-

      - name: Build iOS Xcode Project
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: 6000.2.5f1
          allowDirtyBuild: true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-build
          path: build/iOS/
          retention-days: 7

      - name: Clean CI Branch
        if: always()
        run: |
          git push origin --delete ci/build || true