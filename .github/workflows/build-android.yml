name: Build Android

on:
  workflow_dispatch:

jobs:
  checklicense:
    name: Check UNITY_LICENSE
    runs-on: ubuntu-latest
    outputs:
      is_unity_license_set: ${{ steps.checklicense_job.outputs.is_unity_license_set }}
    steps:
      - name: Check whether UNITY_LICENSE is configured
        id: checklicense_job
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "UNITY_LICENSE is missing in repository secrets."
            echo "is_unity_license_set=false" >> $GITHUB_OUTPUT
          else
            echo "UNITY_LICENSE is configured."
            echo "is_unity_license_set=true" >> $GITHUB_OUTPUT
          fi

  missinglicense:
    needs: checklicense
    if: needs.checklicense.outputs.is_unity_license_set == 'false'
    name: Missing UNITY_LICENSE
    runs-on: ubuntu-latest
    steps:
      - name: Fail with missing license message
        run: |
          echo "UNITY_LICENSE is missing in repository secrets."
          echo "Please open GitHub settings in UniIDE and configure UNITY_LICENSE before running the build again."
          exit 1

  build:
    needs: checklicense
    if: needs.checklicense.outputs.is_unity_license_set == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Restore Library Cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Android
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 6000.2.5f1
          buildMethod: BuildScript.PerformBuildDebug

          androidExportType: androidPackage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-build
          path: build/Android
          retention-days: 7

      - name: Clean CI Branch
        if: always()
        run: |
          git push origin --delete ci/build || true